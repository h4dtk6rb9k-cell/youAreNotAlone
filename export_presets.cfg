; Godot 4 Export Presets
; Сгенерировано для проекта "Досье гражданина"
; Перед экспортом: Project → Export → добавить iOS пресет если не появится автоматически.

[preset.0]

name="iOS"
platform="iOS"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false

[preset.0.options]

; ── Идентификация ──────────────────────────────────────────────────────────
application/app_store_team_id=""
application/bundle_identifier="com.citizenprofile.pilot"
application/display_name="Досье гражданина"
application/short_version="1.0"
application/version="1"
application/signature=""

; ── Устройства ────────────────────────────────────────────────────────────
; 1 = iPhone, 2 = iPad, 3 = iPhone + iPad
application/targeted_device_family=2

; ── Ориентация: только Landscape ─────────────────────────────────────────
; Godot iOS: landscape=true означает доступна; portrait=false означает запрещена
orientations/landscape=true
orientations/portrait=false
orientations/landscape_upside_down=true
orientations/portrait_upside_down=false

; ── Иконки и Launch Screen ────────────────────────────────────────────────
; Заполнить в редакторе через Project → Export → iOS → Resources
icons/ipad_76x76=""
icons/ipad_76x76_2x=""
icons/ipad_83_5x83_5_2x=""
icons/iphone_60x60_2x=""
icons/iphone_60x60_3x=""
launch_screens/iphone_2436x1125=""
launch_screens/ipad_2048x1536=""

; ── Подпись (заполнять через Xcode) ──────────────────────────────────────
; При личном Apple ID: Xcode автоматически создаёт provisioning profile.
; Team ID и provisioning оставить пустыми — Xcode заполнит сам.
application/code_sign_identity_debug=""
application/code_sign_identity_release=""
application/provisioning_profile_uuid_debug=""
application/provisioning_profile_uuid_release=""

; ── Возможности ───────────────────────────────────────────────────────────
capabilities/access_wifi=false
capabilities/push_notifications=false

; ── Версия iOS ────────────────────────────────────────────────────────────
; iPad Air поддерживает iOS 16+; минимум 16.0 даёт Metal 3
application/min_ios_version="16.0"
